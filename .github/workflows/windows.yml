name: Windows desktop app

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build browser assets
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Test SVG imports in the desktop app
        run: npm run test:svg

      - name: Test saved SVG artwork and orientation
        run: npm run test:svg-library

      - name: Test hour numerals and native 3MF downloads
        run: npm run test:numerals-3mf

      - name: Test original SVG artwork, printable details, and 3MF textures
        run: npm run test:svg-details

      - name: Test projects, undo, print checks, and real 3D inspection
        run: npm run test:studio

      - name: Test Bambu A1 filament-color exports
        run: npm run test:bambu

      - name: Build Windows installer
        run: npm run dist:win

      - name: Build Windows portable app
        run: npm run dist:win:portable

      - name: Calculate download checksums
        shell: pwsh
        run: |
          $downloads = Get-ChildItem dist -Filter *.exe | Sort-Object Name
          if ($downloads.Count -lt 2) { throw 'Expected a Windows installer and portable app.' }
          $lines = foreach ($download in $downloads) {
            $checksum = (Get-FileHash $download.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$checksum  $($download.Name)"
          }
          $lines | Set-Content dist/SHA256SUMS.txt -Encoding utf8

      - name: Upload Windows downloads
        id: downloads
        uses: actions/upload-artifact@v4
        with:
          name: Clock-Factory-Windows-x64
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Show download link
        shell: pwsh
        env:
          ARTIFACT_URL: ${{ steps.downloads.outputs.artifact-url }}
        run: |
          "## Clock Factory for Windows" | Add-Content $env:GITHUB_STEP_SUMMARY
          "[Download the Windows app]($env:ARTIFACT_URL)" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Includes the portable app, installer, and SHA-256 checksums. Sign in to GitHub to download." | Add-Content $env:GITHUB_STEP_SUMMARY
